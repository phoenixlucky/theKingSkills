[permissions]
allow = ["Bash(git pull:*)", "Edit", "Bash(Select-String -Pattern:*)", "Bash(Select-String \"id.*78|Manim\" docs/data/skills.json)", "Bash=git add -A; git commit -m \"chore: 更新一键安装提示词（加入具体技能说明和覆盖安装）\"; if ($?) { git push }", "Bash=python -c \"import json,io; d=json.load(io.open('docs/data/skills.json',encoding='utf-8')); print(type(d)); print(list(d.keys()) if isinstance(d,dict) else len(d))\"", "Bash=Select-String -Path docs/js/script.js -Pattern '基础|产品开发|商业与|搜索与' | ForEach-Object { \"$($_.LineNumber): $($_.Line.Trim())\" }", "Bash=Select-String -Path docs/js/script.js -Pattern 'skills\\.json' | ForEach-Object { \"$($_.LineNumber): $($_.Line.Trim())\" }", "Bash=Get-Content -LiteralPath 'docs/data/skills.json' -Encoding UTF8 | Select-String -Pattern 'phoenixlucky' -Context 0,0 | ForEach-Object { $_.LineNumber }; (Get-Content -LiteralPath 'docs/data/skills.json' -Encoding UTF8 | Select-String -Pattern 'phoenixlucky' | Measure-Object).Count", "Bash=git add -A; git commit -m \"feat: 技能索引扩充至 125 个（新增 Skill Vetter、Auto-Updater、Self-Improving Agent 等），同步 docs 站点数据\"; if ($?) { git push origin main }", "Bash=$j = Get-Content -Raw -Encoding UTF8 docs/data/skills.json | ConvertFrom-Json; Write-Host \"TYPE: $($j.GetType().Name)\"; if ($j -is [System.Array]) { Write-Host \"COUNT: $($j.Count)\"; $j[0] | ConvertTo-Json -Depth 3 } else { $j.PSObject.Properties.Name; $j.PSObject.Properties | ForEach-Object { $v = $_.Value; if ($v -is [System.Array]) { Write-Host \"$($_.Name): array count=$($v.Count)\" } else { Write-Host \"$($_.Name): $v\" } } }", "Bash=$j = Get-Content -Raw -Encoding UTF8 docs/data/skills.json | ConvertFrom-Json; Write-Host \"=== CATEGORIES ===\"; $j.categories | ConvertTo-Json -Depth 5; Write-Host \"=== SKILL[0] ===\"; $j.skills[0] | ConvertTo-Json -Depth 4; Write-Host \"=== reasonix sources ===\"; $j.skills | Where-Object { $_.source -match 'reasonix|Reasonix' } | ForEach-Object { \"$($_.id) | $($_.name) | $($_.source) | $($_.category)\" }"]
