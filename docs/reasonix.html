<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reasonix 推荐 Skill — The King Skills</title>
  <link rel="stylesheet" href="css/style.css?v=7">
</head>
<body data-page="reasonix">
  <header class="header">
    <div class="container">
      <nav class="site-nav">
        <a href="index.html" class="nav-link">🏠 全部 Skill</a>
        <a href="reasonix.html" class="nav-link active">⚡ Reasonix 推荐</a>
      </nav>
      <h1>⚡ Reasonix 推荐 Skill</h1>
      <p class="subtitle">面向 Reasonix 用户的精选 Skill 清单，勾选后一键生成 Reasonix 安装指令，直接投喂给 Agent</p>
      <p class="meta">共收录 <strong id="totalCount">0</strong> 个 Skill，覆盖 <strong>13</strong> 大分类 · <span class="gold-hint">👑 金色卡片 = 本站原创精选，已置顶展示</span></p>
    </div>
  </header>

  <main class="container">
    <!-- Controls: Filter + Search -->
    <section class="controls">
      <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" data-cat="all">🏠 全部</button>
      </div>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜索技能名称或描述…" autocomplete="off">
      </div>
    </section>

    <!-- Stats bar -->
    <section class="stats-bar">
      <span>已选 <strong id="selectedCount">0</strong> 个 Skill</span>
      <button class="btn btn-secondary" id="selectAllBtn">✅ 全选</button>
      <button class="btn btn-primary" id="generateBtn">📋 生成 Reasonix 安装指令</button>
      <button class="btn btn-secondary" id="clearBtn">清除选择</button>
    </section>

    <!-- Skill cards grid -->
    <section class="skills-grid" id="skillsGrid">
      <!-- Rendered by JS -->
    </section>

    <!-- Install instructions output -->
    <section class="output-section" id="outputSection" style="display:none;">
      <h2>📋 Reasonix 安装指令</h2>
      <p class="output-hint">将下方内容直接提供给 Reasonix Agent：</p>
      <textarea id="outputText" readonly rows="12"></textarea>
      <button class="btn btn-primary" id="copyBtn">📄 复制到剪贴板</button>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>由 <a href="https://github.com/phoenixlucky/theKingSkills" target="_blank">theKingSkills</a> 项目维护 · <a href="index.html">返回全部 Skill 总览</a></p>
    </div>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="js/script.js?v=8"></script>
</body>
</html>
